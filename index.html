<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Cipher — private messaging and direct-deal commerce. No phone number, no email." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />

    <!-- iOS specific PWA tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cipher" />
    

    <title>Cipher</title>
    <style>
      /* Prevent pull-to-refresh and overscroll on mobile */
      body {
        margin: 0;
        background-color: #000000;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  
    <link rel="icon" type="image/png" href="/logo_raw.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Native launch images: solid #000 so there is no white flash before the app paints.
         Portrait device-pixel canvases, filenames in apple-touch-startup-image-<WxH>.png form. -->
    <link rel="apple-touch-startup-image" href="/apple-touch-startup-image-750x1334.png" />
    <link rel="apple-touch-startup-image" href="/apple-touch-startup-image-1179x2556.png" />
    <link rel="apple-touch-startup-image" href="/apple-touch-startup-image-1290x2796.png" />
    <link rel="apple-touch-startup-image" href="/apple-touch-startup-image-1320x2868.png" />
  </head>
  <body>
    <div id="root">
      <!-- No-JS loading shell. Rendered before any JS arrives and replaced by
           the app on mount: createRoot().render() drops these children. A slow
           link sees the brand and a beat, not a black void. Pure black ground,
           blue accent, charcoal meta — the DESIGN.md one look. -->
      <div aria-hidden="true" class="__cipher-boot">
        <div class="__cipher-boot__mark">Cipher</div>
        <div class="__cipher-boot__meta">Loading Cipher…</div>
        <span class="__cipher-boot__beat"></span>
      </div>
      <style>
        .__cipher-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;color:#f2f4f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
        .__cipher-boot__mark{font-size:26px;font-weight:700;letter-spacing:-0.02em;line-height:1}
        .__cipher-boot__meta{font-size:13px;color:#8a9199}
        .__cipher-boot__beat{width:22px;height:3px;border-radius:9999px;background:#005dfd;animation:__cipherboot 1s ease-in-out infinite}
        @keyframes __cipherboot{0%,100%{opacity:.25;transform:scaleX(.6)}50%{opacity:1;transform:scaleX(1)}}
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
