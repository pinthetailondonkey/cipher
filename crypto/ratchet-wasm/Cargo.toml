[package]
name = "cipher-ratchet-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_json = "=1.0.151"
vodozemac = { version = "=0.11.2", default-features = false, features = ["experimental-session-config", "wasm_js"] }
wasm-bindgen = "=0.2.128"
