[package]
name = "cipher-openmls-wasm-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["js", "libcrux-provider", "test-utils"] }
openmls_memory_storage = { version = "=0.6.0", features = ["test-utils"] }
openmls_traits = "=0.6.0"
openmls_libcrux_crypto = "=0.4.0"
openmls_basic_credential = "=0.6.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.22.1"
getrandom = { version = "=0.2.17", features = ["js"] }
wasm-bindgen = "=0.2.128"
