[package]
name = "cipher-openmls-wasm-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "=0.9.2", default-features = false, features = ["js", "libcrux-provider"] }
openmls_libcrux_crypto = "=0.4.0"
openmls_basic_credential = "=0.6.0"
getrandom = { version = "=0.2.17", features = ["js"] }
wasm-bindgen = "=0.2.128"
